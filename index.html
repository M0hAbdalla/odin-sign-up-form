<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="left-side">
        <div class="title">
          <img src="imgs/odin-lined.png" alt="odin-logo" />
          <h1>ODIN bot</h1>
        </div>
        <p class="credit">
          photo by
          <a href="https://unsplash.com/@haliewestphoto">Halie West</a>
          on
          <a
            href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
            >unsplash</a
          >
        </p>
      </div>
      <div class="right-side">
        <div class="greeting">
          <p>
          This is not a real online service!
            You know you need something like this in your life to help you
            realize your deepest dreams.
          </p>
          <p>sign up <em>now</em> to get started.</p>
          <br />
          <p>You <em>know</em> you want to.</p>
        </div>
        <form method="post">
          <fieldset class="form-details">
            <h2>Let's do this!</h2>
            <div class="form-container">
              <div class="form-groups">
                <label for="first-name">FIRST NAME</label>
                <input type="text" name="first-name" id="first-name" />
              </div>
              <div class="form-groups">
                <label for="last-name">LAST NAME</label>
                <input type="text" name="last-name" id="last-name" />
              </div>
              <div class="form-groups">
                <label for="email">EMAIL</label>
                <input type="email" name="email" id="email" />
              </div>
              <div class="form-groups">
                <label for="phone">PHONE NUMBER</label>
                <input type="tel" name="phone" id="phone" />
              </div>
              <div class="form-groups">
                <label for="password">PASSWORD</label>
                <input
                  type="password"
                  name="password"
                  id="password"
                  pattern="/^(?=.*?[A-Z])(?=.*?[a-z])(?=.*?[0-9])(?=.*?[#?!@$%^&*-]).{8,}$/"
                />
              </div>
              <div class="form-groups">
                <label for="confirm-password">CONFIRM PASSWORD</label>
                <input
                  type="password"
                  name="confirm-password"
                  id="confirm-password"
                />
              </div>
            </div>
          </fieldset>
          <button type="submit">Creat Account</button>
        </form>
        <p class="login">
          Already have an account?
          <a href="">Log in</a>
        </p>
      </div>
    </div>
  </body>
</html>
